[project]
name = "loanchain-ai-service"
version = "0.1.0"
description = "LoanChain AI Document Verification Layer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "web3>=7.5.0",
    "eth-account>=0.13.4",
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "pikepdf>=9.0.0",
    "pyyaml>=6.0.2",
    "pgmpy>=0.1.25",
    "scipy>=1.14.0",
    "numpy>=2.0.0",
    "python-multipart>=0.0.12",
    "pillow>=10.4.0",
    "slowapi>=0.1.9",
    "rapidfuzz>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
